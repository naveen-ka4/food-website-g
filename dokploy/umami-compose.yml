# ==============================================================================
# Umami Analytics Docker Compose for Dokploy
# Ultra-lightweight (~150MB RAM), privacy-friendly, self-hosted analytics.
# ==============================================================================
version: "3.8"

services:
  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-secure_umami_db_password_change_me}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-secure_umami_db_password_change_me}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-replace_with_random_32_char_secret_key}
    depends_on:
      umami-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

volumes:
  umami-db-data:

